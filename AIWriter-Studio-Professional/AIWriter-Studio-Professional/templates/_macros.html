{% macro field(id, label, type="text", value="", error=None, autocomplete=None, hint=None, maxlength=None, extra="") -%}
<div class="field{% if error %} has-error{% endif %}">
  <label for="{{ id }}">{{ label }}</label>
  <input id="{{ id }}" name="{{ id }}" type="{{ type }}" value="{{ value }}" required
         {%- if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}
         {%- if maxlength %} maxlength="{{ maxlength }}"{% endif %}
         {%- if error or hint %} aria-describedby="{% if hint %}{{ id }}-hint {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}
         {%- if error %} aria-invalid="true"{% endif %} {{ extra|safe }}>
  {% if hint %}<p class="hint" id="{{ id }}-hint">{{ hint }}</p>{% endif %}
  {% if error %}<p class="field-error" id="{{ id }}-error">{{ error }}</p>{% endif %}
</div>
{%- endmacro %}

{% macro csrf() -%}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}
