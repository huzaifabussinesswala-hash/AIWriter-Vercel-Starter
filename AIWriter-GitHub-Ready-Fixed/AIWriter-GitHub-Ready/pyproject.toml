[project]
name = "aiwriter-pro"
version = "1.0.0"
description = "AIWriter Pro - AI writing SaaS built with Flask and PostgreSQL"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (tests/test_config.py checks this).
dependencies = [
    "Flask>=3.0,<4",
    "Flask-WTF>=1.2,<2",
    "Werkzeug>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

# Vercel Root Directory must be this folder (the folder containing web_app.py).
[tool.vercel]
entrypoint = "web_app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
