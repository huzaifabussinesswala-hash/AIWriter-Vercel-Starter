[project]
name = "aiwriter-pro"
version = "1.0.0"
description = "Flask-based AI writing SaaS starter"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-WTF>=1.2,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.31,<3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "web_app:app"
