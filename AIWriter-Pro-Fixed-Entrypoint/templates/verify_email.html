{% extends "base.html" %}
{% block title %}Verify email — AIWriter Pro{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">ONE MORE STEP</div><h1>Verify your email</h1>
  <p class="muted">Enter the six-digit code sent to <strong>{{ email }}</strong>.</p>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="otp">Verification code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
    <button class="button full" type="submit">Verify email</button>
  </form>
  <form method="post" action="{{ url_for('resend_verification') }}" class="resend-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="button secondary full" type="submit">Send a new code</button>
  </form>
</section>
{% endblock %}
