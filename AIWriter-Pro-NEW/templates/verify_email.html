{% extends "base.html" %}{% block title %}Verify email — AIWriter Pro{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">ONE QUICK CHECK</span><h1>Verify your email</h1><p class="muted">Enter the six-digit code sent to <b>{{ email }}</b>. It expires in 10 minutes.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required><button class="button full" type="submit" name="action" value="verify">Verify email</button></form><form method="post" class="resend-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary full" type="submit" name="action" value="resend">Resend code</button></form></div></section>{% endblock %}
