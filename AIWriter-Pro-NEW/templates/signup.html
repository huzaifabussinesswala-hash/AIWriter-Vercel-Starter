{% extends "base.html" %}{% block title %}Create account — AIWriter Pro{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">START CREATING</span><h1>Create your account</h1><p class="muted">A better first draft starts with one small step.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Full name</label><input id="name" name="name" maxlength="80" autocomplete="name" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button class="button full" type="submit">Create account</button></form><p class="auth-bottom">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
