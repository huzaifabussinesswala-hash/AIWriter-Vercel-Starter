<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f8"><meta name="description" content="Turn beauty customer feedback into campaign strategy, ad copy and creative briefs."><title>Campaign Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f8;--paper:#fff;--ink:#20212a;--muted:#737583;--line:#e9e9ee;--purple:#6554d9;--soft:#f0edff;--green:#16866b;--font:'DM Sans',sans-serif;--head:'Manrope',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}h1,h2,h3,b.brand{font-family:var(--head);letter-spacing:-.04em}h1{font-size:clamp(40px,5vw,64px);line-height:1.08}h2{font-size:34px;line-height:1.15}h3{font-size:18px}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}.muted{color:var(--muted)}.eyebrow{font-size:11px;color:var(--purple);font-weight:700;letter-spacing:.13em;text-transform:uppercase}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid var(--line);border-radius:9px;background:white;font-weight:700;font-size:13px;cursor:pointer}.primary{background:var(--purple);border-color:var(--purple);color:white}.soft{background:var(--soft);color:var(--purple);border-color:var(--soft)}.brand{display:flex;align-items:center;gap:10px;font:800 17px var(--head)}.mark{width:34px;height:34px;border-radius:10px;background:var(--purple);color:#fff;display:grid;place-items:center}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.links,.actions{display:flex;align-items:center;gap:24px}.links{font-size:13px;color:#5f606c}.hero{padding:90px 0 78px;display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.hero h1{margin:17px 0}.hero h1 span{color:var(--purple)}.hero p{font-size:17px;color:#686a77;max-width:570px}.actions{gap:10px;margin:26px 0 14px}.preview,.card,.panel,.stat,.formcard{background:white;border:1px solid var(--line);border-radius:15px}.preview{padding:18px;box-shadow:0 25px 65px #29204d12;transform:rotate(.5deg)}.previewhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px;font-size:11px;font-weight:700}.previewbody{display:grid;grid-template-columns:100px 1fr;gap:14px;padding-top:15px}.mockside{font-size:10px;color:#888;border-right:1px solid var(--line)}.mockside b{display:block;color:#333;margin-bottom:12px}.mockside span{display:block;padding:7px}.mockside .on{background:var(--soft);color:var(--purple);border-radius:7px}.insight{background:#f7f5ff;border:1px solid #ebe6ff;border-radius:10px;padding:14px;margin:8px 0}.insight small,.tile small{font-size:9px;color:var(--purple);font-weight:800;letter-spacing:.1em}.insight b{display:block;margin:5px 0;font:700 15px var(--head)}.insight p{font-size:10px;margin:0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{border:1px solid var(--line);border-radius:9px;padding:12px;font-size:11px}.tile b{display:block;margin:5px 0}.section{padding:76px 0;border-top:1px solid var(--line)}.intro{max-width:680px;margin-bottom:32px}.intro p{color:var(--muted);font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:23px}.ico{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--purple);display:grid;place-items:center;font-weight:700}.card h3{margin:16px 0 6px}.card p,.step p{font-size:13px;color:var(--muted);margin:0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.step{border-top:2px solid #d6d0ff;padding:15px 12px 0 0}.step small{color:var(--purple);font-weight:800}.step h3{margin:9px 0 5px}.sample{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:center}.samplebox{padding:24px;background:#fff;border:1px solid var(--line);border-radius:16px}.sampletiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sampletiles div{background:#f8f8fa;padding:13px;border-radius:9px}.sampletiles small{color:var(--purple);font-size:10px;font-weight:700}.sampletiles b{display:block;font-size:12px;margin-top:5px}.banner{padding:36px;border-radius:18px;background:#242039;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner p{color:#c8c4d8}.footer{padding:28px 0;display:flex;justify-content:space-between;color:#858692;font-size:12px}
/* workspace */.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:white;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}.sidebar .brand{padding:0 8px 26px}.navlabel{padding:12px 10px 6px;font-size:10px;letter-spacing:.12em;color:#999;font-weight:800}.slink{display:block;padding:10px 11px;border-radius:8px;color:#666875;font-weight:600;font-size:13px;margin:2px 0}.slink.active,.slink:hover{background:var(--soft);color:var(--purple)}.sidebottom{margin-top:auto}.plan{background:#f8f7fc;padding:12px;border-radius:10px;font-size:11px;margin:12px 3px}.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;position:sticky;top:0;z-index:3}.page{padding:30px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}.pagehead h1{font-size:28px;margin:3px 0}.pagehead p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat{padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font:800 27px var(--head);margin:8px 0 2px}.dashgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.panel{padding:19px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panelhead h3{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th{text-align:left;color:#999;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:13px 10px;border-bottom:1px solid #f1f1f3}.badge{font-size:10px;padding:4px 8px;border-radius:20px;background:#f2f1f5}.complete{background:#e9f7f2;color:var(--green)}.draft{background:#fff5e6;color:#a66a16}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{text-align:left;background:white;border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer}.quick b{display:block;margin:7px 0 2px}.quick span{font-size:11px;color:var(--muted)}.formlayout{display:grid;grid-template-columns:1.5fr .8fr;gap:15px;align-items:start}.formcard{padding:20px;margin-bottom:13px}.formcard h3{margin:0 0 4px}.formcard>p{font-size:12px;color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #dedee6;border-radius:8px;background:white;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9283e8;box-shadow:0 0 0 3px #6554d915}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:11px;cursor:pointer}.choice.selected{background:var(--soft);border-color:#b9aef3;color:var(--purple)}.helper{background:#f8f7fc;border:1px solid #eeecf4;padding:16px;border-radius:11px;font-size:12px;color:var(--muted)}.helper b{color:var(--ink)}.result{background:#fff;border:1px solid var(--line);padding:17px;border-radius:12px;margin-top:14px}.result p{font-size:12px;color:#555}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.authleft{background:#242039;color:white;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.authleft h1{font-size:48px;max-width:500px}.authleft p{color:#c9c5d7;max-width:420px}.authmain{display:grid;place-items:center;padding:30px}.authbox{width:min(390px,100%)}.authbox h2{font-size:28px;margin:35px 0 5px}.authbox p{color:var(--muted)}.authfield{margin:16px 0}.authfield label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.authfield input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px}.authfoot{text-align:center;font-size:12px;color:var(--muted);margin:18px}.authfoot a{color:var(--purple);font-weight:700}.note{font-size:10px;color:#999;line-height:1.5}.toast{position:fixed;bottom:20px;right:20px;background:#252238;color:#fff;padding:12px 16px;border-radius:9px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1}
@media(max-width:900px){.hero{gap:30px}.shell{grid-template-columns:205px 1fr}.stats{grid-template-columns:1fr 1fr}.dashgrid,.formlayout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.sample{grid-template-columns:1fr}}
@media(max-width:700px){.wrap{width:calc(100% - 30px)}.links{display:none}.hero{grid-template-columns:1fr;padding:60px 0}.hero h1{font-size:44px}.section{padding:58px 0}.grid,.steps{grid-template-columns:1fr 1fr}.banner{display:block;padding:25px}.banner .btn{margin-top:15px}.shell{display:block}.sidebar{position:fixed;left:-250px;width:235px;z-index:10;transition:left .2s;box-shadow:0 10px 30px #0001}.sidebar.open{left:0}.topbar{padding:0 15px}.page{padding:22px 15px}.pagehead{flex-direction:column}.auth{grid-template-columns:1fr}.authleft{display:none}.authmain{min-height:100vh}}
@media(max-width:500px){.actions{flex-wrap:wrap}.previewbody{grid-template-columns:75px 1fr}.mockside{font-size:9px}.tiles,.sampletiles,.quick,.two{grid-template-columns:1fr}.grid,.steps{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.topbar{height:60px}.pagehead h1{font-size:25px}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const app=document.getElementById('app');let user=JSON.parse(localStorage.getItem('cs_user')||'null');let projects=JSON.parse(localStorage.getItem('cs_projects')||'null')||[{name:'Glow Serum Launch',type:'Product launch',status:'Draft',updated:'Today'},{name:'Summer Skin Routine',type:'Seasonal campaign',status:'Complete',updated:'Yesterday'}];
const mark='<a class="brand" href="#home"><span class="mark">C</span><span>Campaign Studio</span></a>';
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function go(r){location.hash=r}function save(){localStorage.setItem('cs_projects',JSON.stringify(projects))}
function route(){let r=location.hash.slice(1)||'home';if(r==='login'||r==='signup')return auth(r);if(r==='dashboard'||r==='app')return dashboard();if(r==='create')return create();if(r==='projects')return projectPage();if(r==='brand')return brandPage();if(r==='billing')return billing();if(r==='settings')return settings();landing()}window.addEventListener('hashchange',route);
function landing(){app.innerHTML=`
<header class="wrap nav">${mark}<nav class="links"><a href="#features">Platform</a><a href="#workflow">Workflow</a><a href="#sample">Example</a><a href="#pricing">Pricing</a></nav><div class="actions"><a class="btn" href="#login">Log in</a><a class="btn primary" href="#signup">Get started →</a></div></header>
<main><section class="wrap hero"><div><span class="eyebrow">THE CAMPAIGN WORKSPACE FOR BEAUTY COMMERCE</span><h1>Make every campaign start with <span>customer insight.</span></h1><p>Turn product details and customer feedback into sharper campaign angles, ad copy, video concepts and creative briefs — all in one focused workspace.</p><div class="actions"><a class="btn primary" href="#signup">Start creating →</a><a class="btn" href="#sample">Explore workflow</a></div><small class="muted">For skincare, haircare, makeup and personal-care brands.</small></div><div class="preview"><div class="previewhead"><span>CAMPAIGN STUDIO / WORKSPACE</span><span class="badge complete">SAMPLE PROJECT</span></div><div class="previewbody"><aside class="mockside"><b>WORKSPACE</b><span class="on">⌂ Overview</span><span>◈ Insights</span><span>✳ Campaigns</span><span>▤ Projects</span><span>⚙ Brand</span></aside><div><b>Glow Serum Launch</b><div class="insight"><small>CUSTOMER INSIGHT · EXAMPLE</small><b>Customers want a routine that feels easy to keep.</b><p class="muted">A messaging theme to validate against real customer feedback.</p></div><div class="tiles"><div class="tile"><small>AD ANGLE</small><b>Make daily care feel simple</b></div><div class="tile"><small>VIDEO CONCEPT</small><b>A 15-second routine story</b></div></div></div></div></div></section>
<section class="section" id="features"><div class="wrap"><div class="intro"><span class="eyebrow">THE PLATFORM</span><h2>Everything from insight to execution.</h2><p>A connected workflow for the thinking and creative work behind stronger beauty campaigns.</p></div><div class="grid"><article class="card"><span class="ico">◉</span><h3>Customer insight</h3><p>Find recurring needs, objections, questions and customer language in reviews.</p></article><article class="card"><span class="ico">✳</span><h3>Campaign strategy</h3><p>Build audience hypotheses, messaging territories and creative directions.</p></article><article class="card"><span class="ico">Aa</span><h3>Ad copy studio</h3><p>Draft hooks, primary text, headlines and calls to action.</p></article><article class="card"><span class="ico">▷</span><h3>Video concepts</h3><p>Create short-form scripts with scenes, voiceover and shot directions.</p></article><article class="card"><span class="ico">▤</span><h3>Creative briefs</h3><p>Turn selected angles into briefs for creators and designers.</p></article><article class="card"><span class="ico">✓</span><h3>Claim-aware workflow</h3><p>Keep drafts tied to supplied product facts and flag claims for review.</p></article></div></div></section>
<section class="section" id="workflow"><div class="wrap"><div class="intro"><span class="eyebrow">HOW IT WORKS</span><h2>A simple process. A clearer campaign.</h2><p>Start with the product and customer voice, then build a campaign your team can refine.</p></div><div class="steps"><div class="step"><small>01 / CONTEXT</small><h3>Add your product</h3><p>Enter product details, audience and approved claims.</p></div><div class="step"><small>02 / EVIDENCE</small><h3>Add feedback</h3><p>Bring in reviews, questions and customer language.</p></div><div class="step"><small>03 / CREATE</small><h3>Develop assets</h3><p>Shape angles, hooks, ad copy and video ideas.</p></div><div class="step"><small>04 / REFINE</small><h3>Review and share</h3><p>Check accuracy and prepare a creative brief.</p></div></div></div></section>
<section class="section" id="sample"><div class="wrap sample"><div><span class="eyebrow">ILLUSTRATIVE OUTPUT</span><h2>One product. Multiple creative routes.</h2><p class="muted">A fictional skincare example showing how product context can become creative directions. Not a client result or verified claim.</p><a class="btn primary" href="#signup">Create your first project →</a></div><div class="samplebox"><span class="eyebrow">DEMO · SKINCARE</span><h3>Daily hydration routine</h3><p class="muted">A considered step in a simple routine, subject to verified product facts.</p><div class="sampletiles"><div><small>CAMPAIGN ANGLE</small><b>Make the routine feel simple</b></div><div><small>HOOK</small><b>One small step in your daily ritual</b></div><div><small>VIDEO IDEA</small><b>Morning routine, three scenes</b></div><div><small>CREATIVE BRIEF</small><b>Texture, use and routine context</b></div></div></div></div></section>
<section class="section" id="pricing"><div class="wrap"><div class="intro"><span class="eyebrow">PLANS</span><h2>Start with the essentials.</h2><p>Preview the product now. Plan limits, subscriptions and payments will be connected in a later release.</p></div><div class="grid"><article class="card"><h3>Free preview</h3><p>Explore the interface and sample campaign workflow.</p><a class="btn" href="#signup">Try preview</a></article><article class="card"><h3>Pro workspace</h3><p>Planned for brands that create campaigns regularly.</p><small class="muted">Plan details coming soon</small></article><article class="card"><h3>Agency workspace</h3><p>Planned for teams managing multiple beauty brands.</p><small class="muted">Plan details coming soon</small></article></div></div></section>
<section class="section"><div class="wrap banner"><div><span class="eyebrow" style="color:#c7bfff">YOUR NEXT CAMPAIGN STARTS HERE</span><h2>Bring the customer voice into your creative process.</h2><p>Set up a workspace and explore Campaign Studio.</p></div><a class="btn" href="#signup">Create an account →</a></div></section></main><footer class="wrap footer"><span>© 2026 Campaign Studio</span><span>Beauty commerce campaign workspace</span></footer>`}
function auth(type){let sign=type==='signup';app.innerHTML=`<div class="auth"><section class="authleft">${mark}<div><span class="eyebrow" style="color:#c7bfff">THE BEAUTY CAMPAIGN WORKSPACE</span><h1>Turn customer understanding into creative momentum.</h1><p>Keep product context, customer insight and campaign ideas connected in one place.</p></div><small>Campaign Studio · Demo experience</small></section><section class="authmain"><div class="authbox">${mark}<h2>${sign?'Create your workspace':'Welcome back'}</h2><p>${sign?'Start exploring Campaign Studio.':'Log in to continue to your campaigns.'}</p><form id="authform">${sign?'<div class="authfield"><label for="name">Your name</label><input id="name" required placeholder="Alex Morgan"></div>':''}<div class="authfield"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@company.com"></div><div class="authfield"><label for="password">Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn primary" style="width:100%" type="submit">${sign?'Create demo account':'Log in to workspace'} →</button></form><div class="authfoot">${sign?'Already registered? <a href="#login">Log in</a>':'New here? <a href="#signup">Create an account</a>'}</div><p class="note">Demo only: this form saves a sample profile in this browser. It is not production authentication. Do not use a real password or confidential information.</p></div></section></div>`;document.getElementById('authform').onsubmit=e=>{e.preventDefault();user={name:sign?document.getElementById('name').value:(user?.name||document.getElementById('email').value.split('@')[0]),email:document.getElementById('email').value};localStorage.setItem('cs_user',JSON.stringify(user));go('dashboard')}}
function shell(content,active,title){app.innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar">${mark}<div class="navlabel">WORKSPACE</div><a class="slink ${active==='dashboard'?'active':''}" href="#dashboard">⌂ &nbsp; Overview</a><a class="slink ${active==='create'?'active':''}" href="#create">✳ &nbsp; Create campaign</a><a class="slink ${active==='projects'?'active':''}" href="#projects">▤ &nbsp; My projects</a><div class="navlabel">BRAND</div><a class="slink ${active==='brand'?'active':''}" href="#brand">◈ &nbsp; Brand profile</a><div class="navlabel">ACCOUNT</div><a class="slink ${active==='billing'?'active':''}" href="#billing">◇ &nbsp; Plans & billing</a><a class="slink ${active==='settings'?'active':''}" href="#settings">⚙ &nbsp; Settings</a><div class="sidebottom"><div class="plan"><b>Free preview workspace</b><p>Explore the product in demo mode.</p><a href="#billing" style="color:var(--purple)">View plans →</a></div><a class="slink" href="#home">↪ &nbsp; Back to website</a></div></aside><section><header class="topbar"><div><button class="btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button> &nbsp; Workspace / <b>${title}</b></div><span class="muted">${safe(user?.name||'Member')} &nbsp; ●</span></header><main class="page">${content}</main></section></div>`}
function dashboard(){if(!user){go('login');return}let c=`<div class="pagehead"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Good to see you, ${safe(user.name.split(' ')[0])}.</h1><p>Here's what's happening with your campaign workspace.</p></div><a class="btn primary" href="#create">＋ New campaign</a></div><div class="stats"><div class="stat"><small>Total projects</small><strong>${projects.length}</strong><small>Saved in this browser</small></div><div class="stat"><small>Campaign drafts</small><strong>${projects.filter(p=>p.status==='Draft').length}</strong><small>Ready to refine</small></div><div class="stat"><small>Completed</small><strong>${projects.filter(p=>p.status==='Complete').length}</strong><small>Marked complete</small></div><div class="stat"><small>Current plan</small><strong>Free</strong><small>Preview access</small></div></div><div class="dashgrid"><section class="panel"><div class="panelhead"><h3>Recent projects</h3><a href="#projects" style="color:var(--purple)">View all →</a></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Updated</th></tr></thead><tbody>${projects.slice(0,5).map(p=>'<tr><td><b>'+safe(p.name)+'</b></td><td>'+safe(p.type)+'</td><td><span class="badge '+(p.status==='Complete'?'complete':'draft')+'">'+p.status+'</span></td><td>'+p.updated+'</td></tr>').join('')}</tbody></table></div></section><section class="panel"><div class="panelhead"><h3>Quick actions</h3></div><div class="quick"><button onclick="go('create')"><span class="ico">✳</span><b>Start campaign</b><span>Build a new campaign brief</span></button><button onclick="go('brand')"><span class="ico">◈</span><b>Set up brand</b><span>Add product context</span></button><button onclick="go('projects')"><span class="ico">▤</span><b>Browse projects</b><span>Review saved work</span></button><button onclick="go('billing')"><span class="ico">◇</span><b>Explore plans</b><span>See planned features</span></button></div></section></div><section class="panel" style="margin-top:15px"><h3>Campaign workflow</h3><div class="steps"><div class="step"><small>01</small><h3>Product context</h3><p>Define product facts.</p></div><div class="step"><small>02</small><h3>Customer voice</h3><p>Add reviews and feedback.</p></div><div class="step"><small>03</small><h3>Creative direction</h3><p>Develop angles and copy.</p></div><div class="step"><small>04</small><h3>Review & export</h3><p>Check and prepare assets.</p></div></div></section>`;shell(c,'dashboard','Overview')}
function create(){if(!user){go('login');return}let c=`<div class="pagehead"><div><span class="eyebrow">CAMPAIGN BUILDER</span><h1>Create a campaign</h1><p>Give your campaign the context it needs.</p></div><a class="btn" href="#projects">Cancel</a></div><div class="formlayout"><div><form id="campaign"><section class="formcard"><h3>01. Product details</h3><p>Start with the product you want to promote.</p><div class="field"><label for="product">Product or product range *</label><input id="product" required placeholder="Daily Hydration Serum"></div><div class="two"><div class="field"><label for="category">Beauty category</label><select id="category"><option>Skincare</option><option>Haircare</option><option>Makeup</option><option>Personal care</option></select></div><div class="field"><label for="market">Target market</label><input id="market" placeholder="United States"></div></div><div class="field"><label for="facts">Product facts and approved claims</label><textarea id="facts" placeholder="Ingredients, verified benefits, certifications and approved product information..."></textarea></div></section><section class="formcard"><h3>02. Customer feedback</h3><p>Paste review excerpts or recurring customer questions. Remove personal data first.</p><div class="field"><label for="reviews">Customer reviews and feedback</label><textarea id="reviews" placeholder="Paste customer feedback here..."></textarea></div></section><section class="formcard"><h3>03. Campaign direction</h3><div class="field"><label>Campaign objective</label><div class="choices" id="objectives"><button type="button" class="choice selected">Product awareness</button><button type="button" class="choice">Conversions</button><button type="button" class="choice">Education</button><button type="button" class="choice">New launch</button></div></div><div class="two"><div class="field"><label for="channel">Primary channel</label><select id="channel"><option>Meta / Instagram</option><option>TikTok</option><option>YouTube Shorts</option><option>Multi-channel</option></select></div><div class="field"><label for="tone">Brand tone</label><select id="tone"><option>Warm and expert</option><option>Minimal and premium</option><option>Playful and energetic</option><option>Clinical and informative</option></select></div></div><label class="muted"><input type="checkbox" id="claims" checked> Keep suggestions grounded in supplied product facts and flag claims for verification.</label></section><button class="btn primary" type="submit">Create demo campaign draft →</button></form><div id="result"></div></div><aside class="helper"><b>In the full product, you'll get</b><ul><li>Customer insight themes</li><li>Campaign angles and messaging routes</li><li>Ad hooks, headlines and primary text</li><li>15-second video scripts and shot lists</li><li>Creator-ready creative briefs</li><li>Claim review reminders</li></ul><p><b>Demo mode:</b> this saves a local project and shows an example outline. Real AI generation will be connected in the API phase.</p></aside></div>`;shell(c,'create','Create campaign');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('campaign').onsubmit=e=>{e.preventDefault();let name=document.getElementById('product').value.trim();projects.unshift({name:name+' Campaign',type:document.getElementById('category').value+' · '+document.getElementById('channel').value,status:'Draft',updated:'Just now'});save();document.getElementById('result').innerHTML='<section class="result"><span class="eyebrow">DEMO DRAFT CREATED</span><h3>'+safe(name)+' — campaign outline</h3><p><b>Objective:</b> '+document.querySelector('.choice.selected').textContent+'</p><p><b>Creative routes:</b> Customer routine · Product education · Ingredient and texture story</p><p><b>Assets:</b> Ad hooks · Primary copy · 15-second video script · Creator brief</p><small class="muted">Illustrative structure only. No AI output has been generated yet.</small><p><a class="btn" href="#projects">View saved project →</a></p></section>';toast('Demo project saved')}}
function projectPage(){let rows=projects.map(p=>'<tr><td><b>'+safe(p.name)+'</b></td><td>'+safe(p.type)+'</td><td><span class="badge '+(p.status==='Complete'?'complete':'draft')+'">'+p.status+'</span></td><td>'+p.updated+'</td></tr>').join('');shell('<div class="pagehead"><div><span class="eyebrow">YOUR WORK</span><h1>My projects</h1><p>Keep campaign drafts and creative directions together.</p></div><a class="btn primary" href="#create">＋ New campaign</a></div><section class="panel"><div class="panelhead"><h3>All projects</h3><span class="badge">'+projects.length+' projects</span></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Updated</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>','projects','My projects')}
function brandPage(){shell('<div class="pagehead"><div><span class="eyebrow">BRAND CONTEXT</span><h1>Brand profile</h1><p>Save consistent brand and product context for future campaigns.</p></div><button class="btn primary" onclick="saveBrand()">Save profile</button></div><div class="formlayout"><section class="formcard"><h3>Brand information</h3><div class="field"><label for="brandname">Brand name</label><input id="brandname" placeholder="Your beauty brand"></div><div class="field"><label for="site">Website</label><input id="site" placeholder="https://yourbrand.com"></div><div class="field"><label for="position">Brand positioning</label><textarea id="position" placeholder="What makes your brand distinct?"></textarea></div><div class="field"><label for="voice">Brand voice</label><input id="voice" placeholder="Confident, warm, science-led"></div><div class="field"><label for="approved">Approved claims and language</label><textarea id="approved" placeholder="Approved claims and phrases to avoid..."></textarea></div></section><aside class="helper"><b>Why this matters</b><p>Campaign suggestions should reflect your product facts and brand voice, not generic advertising language. Verify all claims before publishing.</p></aside></div>','brand','Brand profile');let b=JSON.parse(localStorage.getItem('cs_brand')||'{}');Object.keys(b).forEach(k=>{let el=document.getElementById(k);if(el)el.value=b[k]})}
function saveBrand(){let b={};['brandname','site','position','voice','approved'].forEach(k=>b[k]=document.getElementById(k).value);localStorage.setItem('cs_brand',JSON.stringify(b));toast('Brand profile saved in this browser')}
function billing(){shell('<div class="pagehead"><div><span class="eyebrow">ACCOUNT PLAN</span><h1>Plans & billing</h1><p>Planned subscription structure for Campaign Studio.</p></div><span class="badge">Demo mode</span></div><div class="grid"><article class="card"><span class="badge complete">CURRENT PREVIEW</span><h2>Free</h2><p>Explore the interface and sample workflow.</p><button class="btn" disabled>Current preview</button></article><article class="card"><span class="badge">PLANNED</span><h2>Pro</h2><p>For beauty brands creating campaigns regularly.</p><small class="muted">Expanded generation · Brand context · Creative exports</small></article><article class="card"><span class="badge">PLANNED</span><h2>Agency</h2><p>For teams managing multiple beauty brands.</p><small class="muted">Multi-brand workspaces · Team collaboration</small></article></div><p class="muted">Prices, billing intervals, checkout and subscription management are not configured. No payments are taken in this preview.</p>','billing','Plans & billing')}
function settings(){shell('<div class="pagehead"><div><span class="eyebrow">PREFERENCES</span><h1>Settings</h1><p>Manage your demo profile and session.</p></div></div><section class="formcard" style="max-width:650px"><h3>Profile</h3><div class="field"><label for="sname">Name</label><input id="sname" value="'+safe(user?.name)+'"></div><div class="field"><label for="semail">Email</label><input id="semail" value="'+safe(user?.email)+'"></div><button class="btn primary" onclick="updateProfile()">Save profile</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Session</h3><button class="btn" onclick="logout()">Log out</button><p class="note">Demo data is stored in this browser only. This is not production authentication or cloud storage.</p></section>','settings','Settings')}
function updateProfile(){user.name=document.getElementById('sname').value;user.email=document.getElementById('semail').value;localStorage.setItem('cs_user',JSON.stringify(user));toast('Profile updated')}function logout(){user=null;localStorage.removeItem('cs_user');go('home')}
route();
</script></body></html>
