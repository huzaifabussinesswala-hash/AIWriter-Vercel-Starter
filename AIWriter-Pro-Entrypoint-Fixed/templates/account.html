{% extends "base.html" %}
{% block title %}Account — AIWriter Pro{% endblock %}
{% block content %}
<section class="page-heading"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>Your account</h1><p class="muted">Update your profile or change your password.</p></section>
<div class="account-grid">
  <section class="panel"><h2>Profile</h2><form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="profile">
    <label for="name">Name</label><input id="name" name="name" value="{{ user.name }}" minlength="2" maxlength="80" required>
    <label for="email">Email</label><input id="email" type="email" name="email" value="{{ user.email }}" required>
    <button class="button" type="submit">Save profile</button>
  </form></section>
  <section class="panel"><h2>Change password</h2><form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password">
    <label for="current_password">Current password</label><input id="current_password" type="password" name="current_password" autocomplete="current-password" required>
    <label for="new_password">New password</label><input id="new_password" type="password" name="new_password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
    <button class="button" type="submit">Change password</button>
  </form></section>
</div>
{% endblock %}
